<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Cannon Kidd Family Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161F29;
  --ink-2:#1E2A38;
  --parchment:#EFE7D5;
  --parchment-2:#E4D9BF;
  --brass:#B08A3E;
  --brass-light:#D9B86B;
  --thread:#8C3B2E;
  --sage:#6E7B58;
  --charcoal:#2A2723;
  --line:rgba(239,231,213,0.14);
  --line-strong:rgba(239,231,213,0.28);
  --shadow:0 12px 30px rgba(0,0,0,0.35);
  --radius:4px;
  --font-display:'Fraunces', serif;
  --font-body:'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--brass-light);outline-offset:2px;
}
::selection{background:var(--brass);color:var(--ink);}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(22,31,41,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;align-items:center;gap:12px;
}
.topbar .brand{
  font-family:var(--font-display);
  font-weight:700;font-size:19px;letter-spacing:0.2px;
  display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;
  cursor:pointer;
}
.topbar .brand small{
  font-family:var(--font-mono);font-size:10px;color:var(--brass-light);
  font-weight:400;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;
}
.icon-btn{
  background:none;border:1px solid var(--line-strong);color:var(--parchment);
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:rgba(239,231,213,0.06);border-color:var(--brass-light);}
.icon-btn.badge{position:relative;}
.icon-btn.badge::after{
  content:attr(data-count);
  position:absolute;top:-4px;right:-4px;
  background:var(--thread);color:var(--parchment);
  font-family:var(--font-mono);font-size:10px;font-weight:600;
  min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.icon-btn.badge[data-count="0"]::after{display:none;}

/* ---------- layout ---------- */
main{flex:1;max-width:640px;width:100%;margin:0 auto;padding:0 0 60px;}
.section-pad{padding:22px 18px;}

/* ---------- hero / rings ---------- */
.hero{padding:28px 18px 8px;text-align:center;}
.hero h1{
  font-family:var(--font-display);font-weight:900;font-size:clamp(28px,7vw,38px);
  margin:0 0 6px;line-height:1.05;
}
.hero p{color:var(--brass-light);font-family:var(--font-mono);font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase;margin:0 0 22px;}

.rings-wrap{display:flex;justify-content:center;margin:8px 0 6px;}
.rings-wrap svg{width:100%;max-width:340px;height:auto;}
.ring{fill:none;stroke-width:14;cursor:pointer;transition:stroke-width .15s,opacity .15s;}
.ring:hover{stroke-width:18;}
.ring-label{font-family:var(--font-mono);font-size:9px;fill:var(--parchment);opacity:.55;}
.ring-center{font-family:var(--font-display);font-weight:700;fill:var(--parchment);}
.ring-center-sub{font-family:var(--font-mono);font-size:9px;fill:var(--brass-light);letter-spacing:1px;}

.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:11px;color:rgba(239,231,213,0.6);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* ---------- search ---------- */
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--ink-2);border:1px solid var(--line-strong);
  border-radius:2px;padding:10px 14px;margin:18px 0 0;
}
.search-bar input{
  flex:1;background:none;border:none;color:var(--parchment);
  font-family:var(--font-body);font-size:15px;
}
.search-bar input::placeholder{color:rgba(239,231,213,0.4);}
.search-bar input:focus{outline:none;}
.search-bar svg{flex-shrink:0;opacity:.6;}

/* ---------- record cards ---------- */
.record-list{display:flex;flex-direction:column;gap:1px;background:var(--line);margin-top:16px;border:1px solid var(--line);}
.record-card{
  background:var(--ink);padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  transition:background .15s;
}
.record-card:hover{background:var(--ink-2);}
.record-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--ink-2);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--brass-light);
}
.record-card .rc-main{flex:1;min-width:0;}
.record-card .rc-name{font-family:var(--font-display);font-weight:600;font-size:16px;}
.record-card .rc-meta{font-family:var(--font-mono);font-size:11px;color:rgba(239,231,213,0.55);margin-top:2px;}
.record-card .rc-arrow{opacity:.4;flex-shrink:0;}
.section-title{
  font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--brass-light);margin:26px 0 0;padding:0 2px;
  display:flex;align-items:center;justify-content:space-between;
}
.back-row{display:flex;align-items:center;gap:10px;padding:16px 0 0;}
.back-link{font-family:var(--font-mono);font-size:12px;color:var(--brass-light);display:flex;align-items:center;gap:6px;}

.empty-state{padding:40px 20px;text-align:center;color:rgba(239,231,213,0.5);font-size:14px;}
.empty-state .es-icon{font-size:28px;margin-bottom:10px;}

/* ---------- profile ---------- */
.profile-head{padding:24px 0 6px;text-align:center;}
.profile-avatar{
  width:84px;height:84px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(155deg,var(--ink-2),var(--ink));
  border:2px solid var(--brass);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--brass-light);
}
.profile-head h2{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0 0 4px;}
.profile-head .p-dates{font-family:var(--font-mono);font-size:12px;color:var(--brass-light);}
.profile-head .p-living{
  display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:10px;
}
.p-living.alive{background:rgba(110,123,88,0.2);color:var(--sage);border:1px solid rgba(110,123,88,0.4);}
.p-living.deceased{background:rgba(140,59,46,0.15);color:#C08074;border:1px solid rgba(140,59,46,0.35);}

.card{
  background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-top:16px;
}
.card h3{
  font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--brass-light);margin:0 0 12px;
}
.fact-row{display:flex;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;}
.fact-row:first-of-type{border-top:none;}
.fact-row .f-label{width:96px;flex-shrink:0;color:rgba(239,231,213,0.55);font-size:12.5px;padding-top:1px;}
.fact-row .f-val{flex:1;line-height:1.45;}
.note-text{font-family:var(--font-body);font-size:14px;line-height:1.6;color:rgba(239,231,213,0.85);white-space:pre-wrap;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:var(--ink);border:1px solid var(--line-strong);border-radius:16px;
  padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;
}
.chip small{font-family:var(--font-mono);font-size:10px;color:rgba(239,231,213,0.45);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:2px;font-size:14px;font-weight:600;
  border:1px solid var(--brass);background:none;color:var(--brass-light);
  width:100%;margin-top:18px;font-family:var(--font-body);
}
.btn:hover{background:rgba(176,138,62,0.1);}
.btn.solid{background:var(--brass);color:var(--ink);border-color:var(--brass);}
.btn.solid:hover{background:var(--brass-light);}
.btn.ghost{border-color:var(--line-strong);color:var(--parchment);}
.btn.thread{border-color:var(--thread);color:#D89186;}
.btn.small{width:auto;padding:8px 14px;font-size:12.5px;margin-top:0;}

/* ---------- forms ---------- */
.form-field{margin-top:16px;}
.form-field label{
  display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:1px;
  text-transform:uppercase;color:var(--brass-light);margin-bottom:7px;
}
.form-field input,.form-field select,.form-field textarea{
  width:100%;background:var(--ink);border:1px solid var(--line-strong);color:var(--parchment);
  padding:11px 13px;font-family:var(--font-body);font-size:14.5px;border-radius:2px;
}
.form-field textarea{min-height:90px;resize:vertical;line-height:1.5;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  outline:none;border-color:var(--brass);
}
.form-hint{font-size:12px;color:rgba(239,231,213,0.45);margin-top:6px;line-height:1.4;}
.banner{
  padding:12px 14px;border-radius:2px;font-size:13px;line-height:1.5;margin-top:16px;
}
.banner.info{background:rgba(176,138,62,0.1);border:1px solid rgba(176,138,62,0.3);color:var(--brass-light);}
.banner.success{background:rgba(110,123,88,0.15);border:1px solid rgba(110,123,88,0.35);color:#9CB080;}
.banner.error{background:rgba(140,59,46,0.15);border:1px solid rgba(140,59,46,0.35);color:#D89186;}

/* ---------- admin / pending ---------- */
.pending-item{
  background:var(--ink-2);border:1px solid var(--line);border-left:3px solid var(--thread);
  padding:14px 16px;margin-top:12px;border-radius:0 var(--radius) var(--radius) 0;
}
.pending-item .pi-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;}
.pending-item .pi-person{font-family:var(--font-display);font-weight:700;font-size:16px;}
.pending-item .pi-meta{font-family:var(--font-mono);font-size:10px;color:rgba(239,231,213,0.45);white-space:nowrap;}
.pending-item .pi-change{font-size:13.5px;background:var(--ink);border:1px solid var(--line);padding:9px 11px;border-radius:2px;margin-bottom:6px;}
.pending-item .pi-change .arrow{color:var(--brass-light);margin:0 6px;}
.pending-item .pi-note{font-size:13px;color:rgba(239,231,213,0.7);font-style:italic;margin:8px 0;}
.pending-actions{display:flex;gap:10px;margin-top:10px;}
.pending-actions .btn{margin-top:0;}

.lock-screen{padding:60px 24px;text-align:center;max-width:340px;margin:0 auto;}
.lock-screen .ls-icon{font-size:34px;margin-bottom:16px;}
.lock-screen h2{font-family:var(--font-display);font-size:22px;margin:0 0 8px;}
.lock-screen p{font-size:13.5px;color:rgba(239,231,213,0.6);line-height:1.5;margin:0 0 20px;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:sticky;bottom:0;z-index:40;
  background:rgba(22,31,41,0.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav button{
  flex:1;background:none;border:none;color:rgba(239,231,213,0.5);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;font-size:10px;font-family:var(--font-mono);letter-spacing:.5px;
  border-radius:6px;position:relative;
}
.bottomnav button.active{color:var(--brass-light);}
.bottomnav button .bn-icon{font-size:18px;}
.bottomnav button .bn-dot{
  position:absolute;top:4px;right:calc(50% - 16px);
  width:7px;height:7px;border-radius:50%;background:var(--thread);
}

@media(min-width:720px){
  main{max-width:760px;}
  .rings-wrap svg{max-width:400px;}
}

</style>

<script>

  pendingEdits: [],      // [{id, personId, personName, submittedBy, changes:[{field,label,oldValue,newValue}], note, ts, status}]
  pendingPeople: [],      // [{id, relatedToId, relatedToName, relationType, name, sex, birthDate, birthPlace, deathDate, notes, submittedBy, note, ts, status}]
  addedPeople: {},        // {pendingId: {...finalized record...}}

const ROOT_ID = FAMILY_DATA.rootId;

const GEN_LABELS = {
  '-5': "3rd Great-Grandparents", '-4': "2nd Great-Grandparents", '-3': "Great-Grandparents",
  '-2': "Grandparents", '-1': "Parents", '0': "Oliver's Generation",
  '1': "Children", '2': "Grandchildren", '3': "Great-Grandchildren", '4': "2nd Great-Grandchildren"
};
function genLabel(g){ return GEN_LABELS[String(g)] || ('Generation ' + g); }

/* ===================== STORAGE ===================== */
async function storeGet(key, fallback){
  try{
    const r = await window.storage.get(key, true);
    return r && r.value !== undefined ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function storeSet(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), true); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}

async function loadAll(){
  const [overrides, pendingEdits, pendingPeople, addedPeople, activityLog] = await Promise.all([
    storeGet('overrides', {}),
    storeGet('pending-edits', []),
    storeGet('pending-people', []),
    storeGet('added-people', {}),
    storeGet('activity-log', []),
  ]);
  state.overrides = overrides;
  state.pendingEdits = pendingEdits;
  state.pendingPeople = pendingPeople;
  state.addedPeople = addedPeople;
  state.activityLog = activityLog;
  state.ready = true;
}

async function logActivity(entry){
  const log = await storeGet('activity-log', []);
  log.unshift(Object.assign({ts: Date.now()}, entry));
  const trimmed = log.slice(0, 80);
  state.activityLog = trimmed;
  await storeSet('activity-log', trimmed);
}

/* ===================== DATA HELPERS ===================== */
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function baseFieldValue(person, field){
  return person[field];
}

function getPerson(id){
  const base = PEOPLE[id] || (state.addedPeople[id] ? state.addedPeople[id] : null);
  if(!base) return null;
  const ov = state.overrides[id] || {};
  const merged = Object.assign({}, base);
  Object.keys(ov).forEach(field => { merged[field] = ov[field].value; });
  merged._overrideMeta = ov;
  merged._id = id;
  return merged;
}

function displayName(p){
  if(!p) return 'Unknown';
  let n = (p.given ? p.given : '') + (p.surname ? ' ' + p.surname : '');
  n = n.trim() || p.name || 'Unknown';
  if(p.suffix) n += ' ' + p.suffix;
  return n;
}
function initials(p){
  const n = displayName(p);
  const parts = n.split(' ').filter(Boolean);
  if(parts.length===0) return '?';
  if(parts.length===1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function yearOf(dateStr){
  if(!dateStr) return '';
  const m = String(dateStr).match(/\d{4}/);
  return m ? m[0] : dateStr;
}
function lifespan(p){
  const b = yearOf(p.birthDate);
  const d = p.deceased ? (yearOf(p.deathDate) || '?') : null;
  if(!b && !d) return p.deceased ? 'dates unknown' : 'living';
  if(d) return (b||'?') + '–' + d;
  return 'b. ' + (b||'?');
}

function relatedPeopleOf(id){
  return Object.entries(state.addedPeople)
    .filter(([k,v]) => v.relatedToId === id)
    .map(([k,v]) => Object.assign({_id:k}, v));
}

function parentsOf(id){
  const p = PEOPLE[id]; if(!p) return [];
  const out = [];
  (p.famc||[]).forEach(fid=>{
    const f = FAMILIES[fid]; if(!f) return;
    if(f.husband && PEOPLE[f.husband]) out.push(f.husband);
    if(f.wife && PEOPLE[f.wife]) out.push(f.wife);
  });
  return out;
}

    const f = FAMILIES[fid]; if(!f) return;
    if(f.husband && f.husband!==id && PEOPLE[f.husband]) spouses.push(f.husband);
    if(f.wife && f.wife!==id && PEOPLE[f.wife]) spouses.push(f.wife);
    (f.children||[]).forEach(c=>{ if(PEOPLE[c]) children.push(c); });
  });
  return {spouses, children};
}
function siblingsOf(id){
  const p = PEOPLE[id]; if(!p) return [];
  const set = new Set();
  (p.famc||[]).forEach(fid=>{
    const f = FAMILIES[fid]; if(!f) return;
    (f.children||[]).forEach(c=>{ if(c!==id && PEOPLE[c]) set.add(c); });
  });
  return Array.from(set);
}

function allGenerations(){
  const set = new Set();
  Object.values(PEOPLE).forEach(p => { if(p.gen!==null && p.gen!==undefined) set.add(p.gen); });
  return Array.from(set).sort((a,b)=>a-b);
}
function peopleInGen(g){
  return Object.entries(PEOPLE)
    .filter(([k,v]) => v.gen === g)
    .map(([k,v]) => getPerson(k))
    .sort((a,b)=> displayName(a).localeCompare(displayName(b)));
}
function searchPeople(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  Object.keys(PEOPLE).forEach(id=>{
    const p = getPerson(id);
    const hay = (displayName(p) + ' ' + (p.birthPlace||'') + ' ' + (p.occupations||[]).join(' ')).toLowerCase();
    if(hay.includes(q)) results.push(p);
  });
  Object.entries(state.addedPeople).forEach(([id,v])=>{
    const p = getPerson(id);
    if(!p) return;
    const hay = (displayName(p) + ' ' + (p.birthPlace||'')).toLowerCase();
    if(hay.includes(q)) results.push(p);
  });
  return results.sort((a,b)=> displayName(a).localeCompare(displayName(b))).slice(0,60);
}

function renderRings(){
  const gens = allGenerations();
  const n = gens.length;
  const cx=160, cy=160, rMin=28, rMax=138;
  let svg = `<svg viewBox="0 0 320 320" role="img" aria-label="Generations diagram">`;
  gens.forEach((g,i)=>{
    const r = n>1 ? rMin + (rMax-rMin)*(i/(n-1)) : (rMin+rMax)/2;
    const isRoot = g===0;
    const color = g<0 ? 'var(--brass)' : (g>0 ? 'var(--sage)' : 'var(--brass-light)');
    const opacity = isRoot ? 1 : 0.4 + 0.35*(i/(n-1));
    const sw = isRoot ? 17 : 10;
    const count = peopleInGen(g).length;
    svg += `<circle class="ring" cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" stroke="${color}" stroke-opacity="${opacity.toFixed(2)}" style="stroke-width:${sw}" data-action="go" data-view="gen" data-gen="${g}"><title>${escapeHtml(genLabel(g))} (${count})</title></circle>`;
  });
  const totalCount = Object.keys(PEOPLE).length + Object.keys(state.addedPeople).length;
  svg += `<text x="160" y="154" text-anchor="middle" class="ring-center" font-size="30">${totalCount}</text>`;
  svg += `<text x="160" y="174" text-anchor="middle" class="ring-center-sub">RECORDS IN THE LEDGER</text>`;
  svg += `</svg>`;
  return svg;
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<2592000) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}

  const app = document.getElementById('app');
  if(!state.ready){
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-mono);color:var(--brass-light);font-size:12px;letter-spacing:1px;">OPENING THE LEDGER&hellip;</div>`;
    return;
  }
  let body = '';
  switch(state.view){
    case 'home': body = renderHome(); break;
    case 'gen': body = renderGenView(); break;
    case 'search': body = renderSearchView(); break;
    case 'profile': body = renderProfile(); break;
    case 'suggest-edit': body = renderSuggestEdit(); break;
    case 'suggest-person': body = renderSuggestPerson(); break;
    case 'updates': body = renderUpdates(); break;
    case 'admin': body = renderAdmin(); break;
    default: body = renderHome();
  }
  app.innerHTML = `${renderTopbar()}<main>${body}</main>${renderBottomNav()}${state.toast ? renderToast() : ''}`;
  wireForms();
  if(state.toast){
    setTimeout(()=>{ state.toast=null; const t=document.querySelector('.toast'); if(t) t.remove(); }, 3200);
  }
  window.scrollTo(0,0);
}

function renderToast(){
  return `<div class="toast" style="position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--brass);color:var(--ink);padding:11px 20px;border-radius:20px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:60;max-width:90%;text-align:center;">${escapeHtml(state.toast)}</div>`;
}
function showToast(msg){ state.toast = msg; render(); }

/* ===================== NAVIGATION ===================== */
function go(view, params){
  if(state.view!=='home' || Object.keys(state.params).length){
    state.history.push({view: state.view, params: state.params});
  }
  state.view = view;
  state.params = params || {};
  render();
}
function goBack(){
  const prev = state.history.pop();
  if(prev){ state.view = prev.view; state.params = prev.params; }
  else { state.view = 'home'; state.params = {}; }
  render();
}

/* ===================== EVENT DELEGATION ===================== */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action==='go'){
    e.preventDefault();
    const view = el.getAttribute('data-view');
    const params = {};
    if(el.hasAttribute('data-id')) params.id = el.getAttribute('data-id');
    if(el.hasAttribute('data-gen')) params.gen = el.getAttribute('data-gen');
    if(view==='search') params.query = state.params.query || '';
    go(view, params);
  }
  else if(action==='back'){ e.preventDefault(); goBack(); }
  else if(action==='lock-admin'){ state.isAdmin = false; go('home'); }
  else if(action==='approve-edit'){ await approveEdit(el.getAttribute('data-id')); }
  else if(action==='reject-edit'){ await rejectEdit(el.getAttribute('data-id')); }
  else if(action==='approve-person'){ await approvePerson(el.getAttribute('data-id')); }
  else if(action==='reject-person'){ await rejectPerson(el.getAttribute('data-id')); }
});

let searchDebounce;
document.addEventListener('input', (e)=>{
  if(e.target.id==='search-input'){
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(()=>{
      state.params.query = val;
      if(state.view!=='search') state.view='search';
      render();
      const inp = document.getElementById('search-input');
      if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }, 180);
  }
});

/* ===================== FORMS ===================== */
function wireForms(){
  const editForm = document.getElementById('edit-form');
  if(editForm){
    const fieldSelect = editForm.querySelector('select[name="field"]');
    const valueLabel = document.getElementById('value-label');
    const updateLabel = ()=>{
      const f = EDITABLE_FIELDS.find(f=>f.key===fieldSelect.value);
      valueLabel.textContent = f.key==='notes' ? 'Story to add' : 'New value';
    };
    fieldSelect.addEventListener('change', updateLabel); updateLabel();
    editForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(editForm);
      const id = state.params.id;
      const p = getPerson(id);
      const field = fd.get('field');
      const fieldMeta = EDITABLE_FIELDS.find(f=>f.key===field);
      const newValue = fd.get('value').trim();
      if(!newValue) return;
      const oldValue = field==='notes' ? '' : (p[field]||'');
      const submitBtn = editForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting\u2026';
      await submitEdit(id, displayName(p), [{
        field, label: fieldMeta.label, oldValue, newValue
      }], fd.get('note')||'', fd.get('submittedBy'));
      showToast('Suggestion submitted for review.');
      go('profile', {id});
    });
  }

  const personForm = document.getElementById('person-form');
  if(personForm){
    personForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(personForm);
      const relatedToId = state.params.id;
      const relatedP = getPerson(relatedToId);
      const submitBtn = personForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting\u2026';
      await submitPerson({
        relatedToId, relatedToName: displayName(relatedP),
        relationType: fd.get('relationType'),
        name: fd.get('name').trim(),
        birthDate: fd.get('birthDate').trim(),
        birthPlace: fd.get('birthPlace').trim(),
        notes: fd.get('notes').trim(),
        submittedBy: fd.get('submittedBy').trim(),
      });
      showToast('New relative submitted for review.');
      go('profile', {id: relatedToId});
    });
  }

  const pinForm = document.getElementById('pin-form');
  if(pinForm){
    pinForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pin = new FormData(pinForm).get('pin');
      const stored = await storeGet('admin-pin', null);
      if(stored && stored.pin === pin){
        state.isAdmin = true; render();
      } else {
        showToast('Incorrect passcode.');
      }
    });
  }
  const pinSetForm = document.getElementById('pin-set-form');
  if(pinSetForm){
    pinSetForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pin = new FormData(pinSetForm).get('pin');
      if(!pin || pin.length<4) return;
      const existing = await storeGet('admin-pin', null);
      if(existing){ showToast('A passcode already exists. Ask the archivist for it.'); return; }
      await storeSet('admin-pin', {pin, ts: Date.now()});
      state.isAdmin = true;
      showToast('Passcode set. You are now the archivist.');
      render();
    });
  }
}

/* ===================== MUTATIONS ===================== */
async function submitEdit(personId, personName, changes, note, submittedBy){
  const list = await storeGet('pending-edits', []);
  list.push({
    id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
    personId, personName, changes, note,
    submittedBy: submittedBy || 'A family member',
    ts: Date.now(), status: 'pending'
  });
  state.pendingEdits = list;
  await storeSet('pending-edits', list);
}
async function submitPerson(data){
  const list = await storeGet('pending-people', []);
  list.push(Object.assign({
    id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
    ts: Date.now(), status: 'pending'
  }, data, {submittedBy: data.submittedBy || 'A family member'}));
  state.pendingPeople = list;
  await storeSet('pending-people', list);
}

async function approveEdit(editId){
  const list = await storeGet('pending-edits', []);
  const idx = list.findIndex(e=>e.id===editId);
  if(idx===-1) return;
  const edit = list[idx];
  const overrides = await storeGet('overrides', {});
  overrides[edit.personId] = overrides[edit.personId] || {};
  edit.changes.forEach(c=>{
    if(c.field==='notes'){
      const p = getPerson(edit.personId);
      const existing = (overrides[edit.personId].notes && overrides[edit.personId].notes.value) || p.notes || [];
      overrides[edit.personId].notes = {value: existing.concat([c.newValue]), by: edit.submittedBy, ts: Date.now()};
    } else {
      overrides[edit.personId][c.field] = {value: c.newValue, by: edit.submittedBy, ts: Date.now()};
    }
  });
  list.splice(idx,1);
  await storeSet('overrides', overrides);
  await storeSet('pending-edits', list);
  state.overrides = overrides; state.pendingEdits = list;
  await logActivity({type:'approved', summary: `Updated ${edit.changes.map(c=>c.label).join(', ')} for ${edit.personName}`, by: 'Archivist'});
  showToast('Change approved.');
}
async function rejectEdit(editId){
  const list = await storeGet('pending-edits', []);
  const idx = list.findIndex(e=>e.id===editId);
  if(idx===-1) return;
  const edit = list[idx];
  list.splice(idx,1);
  await storeSet('pending-edits', list);
  state.pendingEdits = list;
  await logActivity({type:'rejected', summary: `Declined a suggested edit for ${edit.personName}`, by: 'Archivist'});
  showToast('Suggestion rejected.');
}
async function approvePerson(pendingId){
  const list = await storeGet('pending-people', []);
  const idx = list.findIndex(e=>e.id===pendingId);
  if(idx===-1) return;
  const person = list[idx];
  const added = await storeGet('added-people', {});
  const newId = 'added-' + pendingId;
  added[newId] = {
    name: person.name, given: person.name, surname:'',
    sex:'', birthDate: person.birthDate, birthPlace: person.birthPlace,
    deceased:false, notes: person.notes ? [person.notes] : [],
    relatedToId: person.relatedToId, relationType: person.relationType, status:'approved'
  };
  list.splice(idx,1);
  await storeSet('added-people', added);
  await storeSet('pending-people', list);
  state.addedPeople = added; state.pendingPeople = list;
  await logActivity({type:'approved', summary: `Added ${person.name} as ${person.relationType} of ${person.relatedToName}`, by:'Archivist'});
  showToast('Family member added.');
}
async function rejectPerson(pendingId){
  const list = await storeGet('pending-people', []);
  const idx = list.findIndex(e=>e.id===pendingId);
  if(idx===-1) return;
  const person = list[idx];
  list.splice(idx,1);
  await storeSet('pending-people', list);
  state.pendingPeople = list;
  await logActivity({type:'rejected', summary: `Declined adding ${person.name}`, by:'Archivist'});
  showToast('Suggestion rejected.');
}

/* ===================== INIT ===================== */
(async function init(){
  render();
  await loadAll();
  render();
})();

</script>
